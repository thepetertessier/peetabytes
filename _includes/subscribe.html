<section id="subscribe" class="subscribe-card" aria-label="Subscribe by email">
  <h2 class="subscribe-title">Get new posts by email</h2>
  <form action="https://buttondown.com/api/emails/embed-subscribe/petertessier" method="post" class="subscribe-form">
    <label for="bd-email" class="visually-hidden">Email address</label>
    <input type="email" name="email" id="bd-email" class="form-control" placeholder="you@example.com"
      autocomplete="email" required />
    <input type="hidden" name="embed" value="1" />
    <button type="submit" class="subscribe-button">Subscribe</button>
  </form>
  <p class="subscribe-note">
    Powered by
    <a href="https://buttondown.com/refer/petertessier" target="_blank" rel="noopener">Buttondown</a>.
  </p>
</section>
