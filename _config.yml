# The Site Configuration

theme: jekyll-theme-chirpy

lang: en
timezone:

title: Peetabytes
tagline: Peter's byte-sized thoughts on coding, AI, and anything else.
description: >-
  Peter's byte-sized thoughts on coding, AI, and anything else.

url: "https://blog.petertessier.com"
baseurl: ""

github:
  username: thepetertessier

social:
  name: Peter Tessier
  email: peter@petertessier.com
  links:
    - https://www.linkedin.com/in/petertessier
    - https://github.com/thepetertessier

theme_mode:
toc: true

comments:
  provider:

paginate: 10
permalink: /:year/:month/:day/:title/

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
