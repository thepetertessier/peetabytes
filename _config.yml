title: Peetabytes
description: >-
  Notes from a developer on code, AI-assisted coding, and whatever
  else I'm building. Unpolished on purpose.
email: peter@petertessier.com
url: "https://blog.petertessier.com"
baseurl: ""

theme: minima
minima:
  skin: classic
  social_links:
    - {
        platform: linkedin,
        user_url: "https://www.linkedin.com/in/petertessier",
      }
    - { platform: github, user_url: "https://github.com/thepetertessier" }

plugins:
  - jekyll-feed

# Markdown / build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Files/folders Jekyll should ignore when building
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
